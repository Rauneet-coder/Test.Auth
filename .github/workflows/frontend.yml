name: Frontend CI & Docker Hub

'on':
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  check:
    name: Test & Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and Push Docker image
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Docker Hub credentials missing. Please set DOCKER_USERNAME and DOCKER_PASSWORD in GitHub repository secrets."
            exit 1
          fi

          DOCKER_USER=$(echo "$DOCKER_USERNAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          DOCKER_PASS=$(echo "$DOCKER_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')

          if [[ "$DOCKER_USER" == *"@"* ]]; then
            echo "::error::DOCKER_USERNAME must be your Docker Hub username (Docker ID), NOT an email address. Update it using: gh secret set DOCKER_USERNAME --app actions"
            exit 1
          fi

          REPO_OWNER=$(echo "$DOCKER_USER" | tr '[:upper:]' '[:lower:]')

          printf '%s' "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker build -t "$REPO_OWNER/aith-frontend:latest" ./frontend
          docker push "$REPO_OWNER/aith-frontend:latest"
